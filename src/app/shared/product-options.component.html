<div class="eyebrow">Monte seu solo</div><h2>{{product().name}}</h2>@if(product().image){<img class="modal-image" [src]="'assets/'+product().image" [alt]="product().name">}<p class="muted">{{product().description}}</p><form #f="ngForm" (ngSubmit)="add()"><h4>Turbine seu pedido</h4>@for(e of extras;track e.name){<label class="option"><span><input type="checkbox" [checked]="picked().includes(e.name)" (change)="toggle(e.name,'extra')"> {{e.name}}</span><span>+ {{e.price|money}}</span></label>}<h4>Prefere sem?</h4>@for(i of ingredients;track i){<label class="option"><span><input type="checkbox" (change)="toggle(i,'remove')"> Sem {{i.toLowerCase()}}</span></label>}<div class="row" style="margin-top:20px"><label class="field">Quantidade<input type="number" name="qty" min="1" max="50" required [ngModel]="qty()" (ngModelChange)="qty.set($event)"></label><strong class="price">{{price()|money}}</strong></div><button class="primary gold wide" [disabled]="f.invalid">Adicionar à sacola →</button></form>
