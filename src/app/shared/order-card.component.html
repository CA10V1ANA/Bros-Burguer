<article class="order"><div class="row"><h3>#{{order().id}}</h3><span class="status">{{statuses[order().status]}}</span></div><p>{{order().name}}<br>{{count()}} itens · {{order().source}} · {{order().date|date:'HH:mm'}}</p><div class="row"><strong class="price">{{subtotal(order().items)+order().fee|money}}</strong><button class="smallbtn" (click)="ui.open({kind:'order',id:order().id})">Detalhes ↗</button></div>@if(order().status<4){<button class="primary wide" (click)="store.setStatus(order().id,order().status+1)">{{next[order().status]}} →</button>}</article>
