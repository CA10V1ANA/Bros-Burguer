<div class="eyebrow">Gestão do cardápio</div><h2>{{product()?'Editar':'Novo'}} produto</h2><form [formGroup]="form" (ngSubmit)="save()"><label class="field">Nome<input formControlName="name" maxlength="60"></label><div class="formgrid"><label class="field">Preço demonstrativo (R$)<input type="number" formControlName="price" min="0.01" step="0.01"></label><label class="field">Categoria<select formControlName="category">@for(c of store.categories();track c){<option>{{c}}</option>}</select></label></div><label class="field">Descrição<textarea formControlName="description" maxlength="250"></textarea></label>@if(form.invalid&&form.touched){<p class="form-error">Preencha os campos e informe um preço maior que zero.</p>}<button class="primary gold wide">Salvar no cardápio</button></form>
