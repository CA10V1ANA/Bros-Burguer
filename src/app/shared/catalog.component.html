<div class="toolbar"><div class="categories">@for(c of ['Todos',...store.categories()];track c){<button class="chip" [class.active]="category()===c" (click)="category.set(c)">{{c==='Todos'?'⚡ ':''}}{{c}}</button>}</div><input class="search" aria-label="Buscar produtos" placeholder="⌕ Qual é o seu próximo hit?" [ngModel]="search()" (ngModelChange)="search.set($event)"></div>
<div class="grid" id="products">@for(p of filtered();track p.id){<article class="product"><div class="photo">@if(p.image){<img [src]="'assets/'+p.image" [alt]="p.name" loading="lazy">}@else{<div class="empty"><span>✦</span>{{p.category}}</div>}@if(p.badge){<span class="badge">{{p.badge}}</span>}</div><div class="product-body"><h3>{{p.name}}</h3><p>{{p.description}}</p><div class="product-foot"><span class="price">{{p.price|money}}</span><button class="add" (click)="ui.open({kind:'product',product:p})">＋ Adicionar</button></div></div></article>}@empty{<div class="noresults">Nenhum produto encontrado. Tente outra busca ou categoria.</div>}</div>
