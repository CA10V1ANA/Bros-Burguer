<div class="eyebrow">Ajuste o seu line-up</div><div class="sectionhead"><h2>Produtos</h2><div style="display:flex;gap:8px"><button class="smallbtn" (click)="ui.open({kind:'category'})">＋ Categoria</button><button class="primary gold" (click)="ui.open({kind:'edit'})">＋ Produto</button></div></div>@for(p of store.products();track p.id){<div class="productrow">@if(p.image){<img [src]="'assets/'+p.image" [alt]="p.name">}<div class="grow"><h3>{{p.name}}</h3><span class="muted">{{p.category}} · {{p.price|money}}</span></div><button class="smallbtn" [class.available]="p.available" [class.unavailable]="!p.available" (click)="store.toggleProduct(p.id)">{{p.available?'● Disponível':'○ Indisponível'}}</button><button class="smallbtn" (click)="ui.open({kind:'edit',product:p})">Editar</button></div>}
